<svg xmlns="http://www.w3.org/2000/svg" width="850" height="310" viewBox="0 0 850 310" role="img" aria-labelledby="title desc">
<title id="title">Training label availability and first test boundary</title>
<desc id="desc">A safe train label ends before the embargo boundary; a leaking label becomes available after the first test begins.</desc>
<rect width="850" height="310" rx="14" fill="#f4f8fa"/>
<text x="30" y="38" font-family="sans-serif" font-size="23" fill="#132739">Time-aware label checks</text>
<path d="M70 252 H785" stroke="#476276" stroke-width="3"/>
<path d="M480 66 V258" stroke="#bc6a22" stroke-dasharray="8 7" stroke-width="3"/>
<path d="M620 66 V258" stroke="#2e5679" stroke-dasharray="8 7" stroke-width="3"/>
<text x="455" y="58" font-family="sans-serif" font-size="16" text-anchor="end" fill="#94531b">cutoff = test - embargo</text>
<text x="625" y="58" font-family="sans-serif" font-size="16" fill="#2e5679">first test</text>
<text x="34" y="116" font-family="sans-serif" font-size="16" fill="#132739">Safe label</text>
<path d="M176 108 H395" stroke="#258566" stroke-width="14" stroke-linecap="round"/>
<circle cx="395" cy="108" r="9" fill="#258566"/>
<text x="410" y="113" font-family="sans-serif" font-size="14" fill="#186b50">available</text>
<text x="34" y="186" font-family="sans-serif" font-size="16" fill="#132739">Late label</text>
<path d="M176 179 H678" stroke="#c34b42" stroke-width="14" stroke-linecap="round"/>
<circle cx="678" cy="179" r="9" fill="#c34b42"/>
<text x="692" y="184" font-family="sans-serif" font-size="14" fill="#9b2f29">leak</text>
<text x="70" y="285" font-family="sans-serif" font-size="14" fill="#476276">Schematic only; not measured data. Explicit UTC instants are required.</text>
</svg>
